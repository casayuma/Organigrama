<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama — Casa Yuma</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF9F6;--surface:#FFFFFF;--surface2:#F4F2EE;
  --border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.18);
  --text:#1A1916;--text2:#6B6860;--text3:#A09D96;
  --green:#3B5A3A;--green-light:#C8D8A2;
  --r:8px;--rlg:12px;--line:rgba(0,0,0,0.15);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.logo-mark{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:20px;height:20px;fill:none;stroke:var(--green-light);stroke-width:1.5}
.hdr-title{font-size:16px;font-weight:500}
.hdr-sub{font-size:12px;color:var(--text2);margin-top:1px}
.hdr-right{margin-left:auto}
.search-box{font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 12px;border-radius:20px;border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text);outline:none;width:200px;transition:border-color .15s}
.search-box:focus{border-color:var(--green)}
.search-box::placeholder{color:var(--text3)}
main{padding:24px 28px;overflow-x:auto}
.stats{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:11px 16px;min-width:140px}
.stat-n{font-size:22px;font-weight:500}
.stat-l{font-size:12px;color:var(--text2);margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.fbtn{font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.fbtn:hover{background:var(--surface2);color:var(--text)}
.fbtn.active{background:var(--green);color:var(--green-light);border-color:var(--green)}
.tree-wrap{min-width:960px}
.dept-section{margin-bottom:36px}
.dept-label{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.dept-label::after{content:'';flex:1;height:0.5px;background:var(--border)}
.dept-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dept-roots{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.branch{display:flex;flex-direction:column;align-items:center;position:relative}
.branch-children{display:flex;gap:10px;position:relative;justify-content:center}
.node{display:flex;flex-direction:column;align-items:center;padding:8px 8px 10px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rlg);cursor:pointer;transition:all .15s;width:108px;flex-shrink:0;position:relative}
.node:hover{border-color:var(--border-strong);box-shadow:0 2px 8px rgba(0,0,0,.07);transform:translateY(-1px)}
.node.dimmed{opacity:.18;pointer-events:none}
.node.highlighted{border-color:var(--green);outline:1px solid var(--green)}
.node.vacante{border-style:dashed;opacity:.5;cursor:default}
.node.vacante:hover{transform:none;box-shadow:none}
.node-avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;margin-bottom:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.node-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.node-name{font-size:11px;font-weight:500;text-align:center;line-height:1.3;margin-bottom:2px}
.node-role{font-size:10px;color:var(--text2);text-align:center;line-height:1.3}
.node-nick{font-size:9px;color:var(--text3);text-align:center;margin-top:2px}
.conn-v{width:1px;background:var(--line);margin:0 auto}
.conn-h{height:1px;background:var(--line);position:absolute;top:0}
.conn-tick{width:1px;background:var(--line);position:absolute;top:0}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rlg);padding:20px;width:290px;max-width:100%;position:relative}
.modal-x{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;line-height:1}
.m-avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500}
.m-name{font-size:15px;font-weight:500;line-height:1.3}
.m-role{font-size:13px;color:var(--text2);margin:3px 0 14px}
.m-table{width:100%;font-size:12px;border-collapse:collapse}
.m-table td{padding:5px 0;border-bottom:0.5px solid var(--border);vertical-align:top}
.m-table tr:last-child td{border:none}
.m-table td:first-child{color:var(--text2);width:90px}
.hidden{display:none!important}
</style>
</head>

function initials(n){
  if(n==="VACANTE"||n==="Alberto TBD")return"?";
  const p=n.trim().split(" ");
  return(p[0][0]+(p[1]?p[1][0]:"")).toUpperCase();
}

function makeAvatar(p,size=50){
  const cfg=DEPT_CFG[p.dept];
  const el=document.createElement("div");
  el.className="node-avatar";
  el.style.cssText=`width:${size}px;height:${size}px;background:${p.vacante?"#E8E6E0":cfg.light};color:${p.vacante?"#999":cfg.text}`;
  if(!p.vacante){
    const img=document.createElement("img");
    img.src=`fotos/${p.id}.jpg`; img.alt=p.short; img.style.display="none";
    img.onload=()=>{ el.textContent=""; img.style.display="block"; el.style.background="none"; };
    el.appendChild(img);
  }
  el.appendChild(document.createTextNode(initials(p.name)));
  return el;
}

function makeNode(p){
  const el=document.createElement("div");
  el.className="node"+(p.vacante?" vacante":"");
  el.dataset.id=p.id; el.dataset.dept=p.dept;
  el.dataset.name=(p.name+" "+p.role+(p.nickname?" "+p.nickname:"")).toLowerCase();
  if(!p.vacante) el.onclick=()=>openModal(p.id);
  el.appendChild(makeAvatar(p));
  const nm=document.createElement("div"); nm.className="node-name"; nm.textContent=p.short; el.appendChild(nm);
  const rl=document.createElement("div"); rl.className="node-role"; rl.textContent=p.role; el.appendChild(rl);
  if(p.nickname){ const nk=document.createElement("div"); nk.className="node-nick"; nk.textContent=`"${p.nickname}"`; el.appendChild(nk); }
  return el;
}

function buildBranch(person,all){
  const children=all.filter(p=>p.jefe===person.id);
  const wrap=document.createElement("div"); wrap.className="branch";
  wrap.appendChild(makeNode(person));
  if(!children.length) return wrap;
  const stem=document.createElement("div"); stem.className="conn-v"; stem.style.height="20px"; wrap.appendChild(stem);
  const row=document.createElement("div"); row.className="branch-children";
  children.forEach(c=>row.appendChild(buildBranch(c,all)));
  wrap.appendChild(row);
  return wrap;
}

function drawLines(){
  document.querySelectorAll(".branch-children").forEach(row=>{
    const branches=[...row.children].filter(el=>el.classList.contains("branch"));
    if(branches.length<2) return;
    const rr=row.getBoundingClientRect();
    const f=branches[0].querySelector(".node").getBoundingClientRect();
    const l=branches[branches.length-1].querySelector(".node").getBoundingClientRect();
    const left=f.left+f.width/2-rr.left, right=l.left+l.width/2-rr.left;
    let hbar=row.querySelector(":scope>.conn-h");
    if(!hbar){hbar=document.createElement("div");hbar.className="conn-h";row.insertBefore(hbar,row.firstChild);}
    hbar.style.cssText=`position:absolute;top:0;left:${left}px;width:${right-left}px;height:1px;background:var(--line)`;
    branches.forEach(b=>{
      const nr=b.querySelector(".node").getBoundingClientRect();
      const cx=nr.left+nr.width/2-rr.left;
      let tick=b.querySelector(":scope>.conn-tick");
      if(!tick){tick=document.createElement("div");tick.className="conn-tick";b.insertBefore(tick,b.firstChild);}
      tick.style.cssText=`position:absolute;left:${cx}px;top:0;width:1px;height:18px;background:var(--line);transform:translateX(-50%)`;
    });
  });
}

function renderDept(dept){
  const people=PEOPLE.filter(p=>p.dept===dept);
  const roots=people.filter(p=>!p.jefe||!people.find(x=>x.id===p.jefe));
  const cfg=DEPT_CFG[dept];
  const sec=document.createElement("div"); sec.className="dept-section"; sec.dataset.dept=dept;
  const lbl=document.createElement("div"); lbl.className="dept-label"; lbl.style.color=cfg.color;
  const dot=document.createElement("span"); dot.className="dept-dot"; dot.style.background=cfg.color;
  lbl.appendChild(dot); lbl.appendChild(document.createTextNode(DEPT_NAMES[dept]));
  sec.appendChild(lbl);
  const rw=document.createElement("div"); rw.className="dept-roots";
  roots.forEach(r=>rw.appendChild(buildBranch(r,people)));
  sec.appendChild(rw);
  return sec;
}

function renderAll(){
  const tree=document.getElementById("tree"); tree.innerHTML="";
  DEPTS.forEach(d=>tree.appendChild(renderDept(d)));
  requestAnimationFrame(()=>requestAnimationFrame(drawLines));
}

function renderStats(){
  const a=PEOPLE.filter(p=>!p.vacante).length, v=PEOPLE.filter(p=>p.vacante).length;
  const fab=PEOPLE.filter(p=>p.dept==="F&B"&&!p.vacante).length;
  const rooms=PEOPLE.filter(p=>(p.dept==="Recepción"||p.dept==="Ama de llaves")&&!p.vacante).length;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="stat-n">${a}</div><div class="stat-l">Colaboradores activos</div></div>
    <div class="stat"><div class="stat-n">${v}</div><div class="stat-l">Vacantes abiertas</div></div>
    <div class="stat"><div class="stat-n">${fab}</div><div class="stat-l">Equipo A&amp;B</div></div>
    <div class="stat"><div class="stat-n">${rooms}</div><div class="stat-l">Rooms &amp; Recepción</div></div>`;
}

function filterDept(dept,btn){
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active")); btn.classList.add("active");
  document.querySelectorAll(".dept-section").forEach(s=>s.classList.toggle("hidden",dept!=="all"&&s.dataset.dept!==dept));
}

document.getElementById("search").addEventListener("input",function(){
  const q=this.value.toLowerCase().trim();
  document.querySelectorAll(".node").forEach(n=>{
    const m=!q||n.dataset.name.includes(q);
    n.classList.toggle("dimmed",!m&&!!q); n.classList.toggle("highlighted",m&&!!q);
  });
});

function openModal(id){
  const p=PEOPLE.find(x=>x.id===id); if(!p||p.vacante) return;
  const cfg=DEPT_CFG[p.dept];
  const jefe=p.jefe?PEOPLE.find(x=>x.id===p.jefe):null;
  const av=`<div class="m-avatar" style="background:${cfg.light};color:${cfg.text}">${initials(p.name)}</div>`;
  document.getElementById("modal-body").innerHTML=`${av}
    <div class="m-name">${p.name}${p.nickname?` <span style="font-weight:400;color:#999">"${p.nickname}"</span>`:""}</div>
    <div class="m-role">${p.role} &middot; ${DEPT_NAMES[p.dept]}</div>
    <table class="m-table">
      ${p.email?`<tr><td>Email</td><td>${p.email}</td></tr>`:""}
      ${p.bday?`<tr><td>Cumpleaños</td><td>${p.bday}</td></tr>`:""}
      ${jefe?`<tr><td>Reporta a</td><td>${jefe.short}</td></tr>`:""}
    </table>`;
  document.getElementById("overlay").classList.add("open");
}

function closeModal(e){
  if(!e||e.target===document.getElementById("overlay")||e.currentTarget?.classList?.contains("modal-x"))
    document.getElementById("overlay").classList.remove("open");
}

window.addEventListener("resize",()=>requestAnimationFrame(drawLines));
renderStats();
renderAll();
</script>
</body>
</html>
