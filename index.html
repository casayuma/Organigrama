<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF9F6;--surface:#FFF;--surface2:#F4F2EE;
  --border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.2);
  --text:#1A1916;--text2:#6B6860;--text3:#A09D96;
  --green:#3B5A3A;--green-light:#C8D8A2;
  --line:rgba(0,0,0,0.13);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOCK */
#lock-screen{position:fixed;inset:0;background:#FAF9F6;z-index:999;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:60px 20px 40px}
.lock-box{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:16px;padding:36px 32px;width:100%;max-width:320px;text-align:center}
.lock-logo{width:48px;height:48px;background:#3B5A3A;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.lock-logo svg{width:26px;height:26px;fill:none;stroke:#C8D8A2;stroke-width:1.5}
.lock-title{font-size:18px;font-weight:500;margin-bottom:4px}
.lock-sub{font-size:13px;color:#6B6860;margin-bottom:24px}
.lock-input{width:100%;font-family:'DM Sans',sans-serif;font-size:22px;letter-spacing:8px;text-align:center;padding:10px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;outline:none;background:#FAF9F6;color:#1A1916}
.lock-input:focus{border-color:#3B5A3A}
.lock-btn{margin-top:14px;width:100%;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px;background:#3B5A3A;color:#C8D8A2;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s}
.lock-btn:hover{opacity:.85}
.lock-error{font-size:12px;color:#993556;margin-top:10px;min-height:18px}

/* HEADER */
header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.logo{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo svg{width:20px;height:20px;fill:none;stroke:var(--green-light);stroke-width:1.5}
.hdr-text .title{font-size:16px;font-weight:500}
.hdr-text .sub{font-size:12px;color:var(--text2)}
.search{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 14px;border-radius:20px;border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text);outline:none;width:220px}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}

main{padding:24px 28px;overflow-x:auto}
.stats{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.stat{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px 16px;min-width:130px}
.stat-n{font-size:22px;font-weight:500}
.stat-l{font-size:12px;color:var(--text2);margin-top:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.fbtn{font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.fbtn:hover{background:var(--surface2);color:var(--text)}
.fbtn.active{background:var(--green);color:var(--green-light);border-color:var(--green)}
#tree{min-width:900px}
.dsec{margin-bottom:36px}
.dlabel{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.dlabel::after{content:'';flex:1;height:0.5px;background:var(--border)}
.ddot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.droots{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.branch{display:flex;flex-direction:column;align-items:center}
.bchildren{display:flex;gap:10px;position:relative;justify-content:center}
.node{display:flex;flex-direction:column;align-items:center;padding:8px 8px 10px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;width:108px;flex-shrink:0;position:relative;transition:all .15s}
.node:not(.vac){cursor:pointer}
.node:not(.vac):hover{border-color:var(--border-strong);box-shadow:0 2px 8px rgba(0,0,0,.07);transform:translateY(-1px)}
.node.vac{border-style:dashed;opacity:.5}
.node.dim{opacity:.15;pointer-events:none}
.node.hl{border-color:var(--green);outline:1px solid var(--green)}
.av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;margin-bottom:7px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.nn{font-size:11px;font-weight:500;text-align:center;line-height:1.3;margin-bottom:2px}
.nr{font-size:10px;color:var(--text2);text-align:center;line-height:1.3}
.nk{font-size:9px;color:var(--text3);text-align:center;margin-top:2px}
.vline{width:1px;background:var(--line);margin:0 auto}
.hline{height:1px;background:var(--line);position:absolute;top:0;pointer-events:none}
.tick{width:1px;background:var(--line);position:absolute;top:0;pointer-events:none}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:20px;width:300px;max-width:100%;position:relative}
.mx{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;line-height:1}
.mav{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;margin-bottom:10px;overflow:hidden;flex-shrink:0;cursor:pointer;position:relative}
.mav:hover .mav-ov{opacity:1}
.mav-ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:50%}
.mav-ov svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8}
.mav img{width:100%;height:100%;object-fit:cover}
.mname{font-size:15px;font-weight:500;line-height:1.3}
.mrole{font-size:13px;color:var(--text2);margin:3px 0 14px}
.mtable{width:100%;font-size:12px;border-collapse:collapse}
.mtable td{padding:5px 0;border-bottom:0.5px solid var(--border);vertical-align:top}
.mtable tr:last-child td{border:none}
.mtable td:first-child{color:var(--text2);width:90px}
.upload-btn{margin-top:14px;width:100%;font-family:'DM Sans',sans-serif;font-size:12px;padding:8px;border-radius:8px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.upload-btn:hover{background:var(--surface2)}
.upload-status{font-size:11px;color:var(--text3);text-align:center;margin-top:8px;min-height:16px}
.loading-bar{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.hidden{display:none!important}
</style>

// ─── PIN ───────────────────────────────────────────────────────────────────
async function sha256(str) {
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
window.checkPin = async function() {

  if (!val) return;

};

// ─── CSV LOADER ────────────────────────────────────────────────────────────
function parseCSV(text) {
  var rows = [], cur = [], field = "", inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) { if (c==='"' && text[i+1]==='"'){field+='"';i++;} else if(c==='"'){inQ=false;} else {field+=c;} }
    else if (c==='"'){inQ=true;}
    else if (c===','){cur.push(field.trim());field="";}
    else if (c==='\n'||c==='\r'){if(field||cur.length){cur.push(field.trim());rows.push(cur);}cur=[];field="";}
    else {field+=c;}
  }
  if(field||cur.length){cur.push(field.trim());rows.push(cur);}
  return rows;
}

async function loadCSV() {
  try {
    var res = await fetch(CSV_URL + "&t=" + Date.now());
    var text = await res.text();
    var rows = parseCSV(text);
    // rows[0] = headers, rows[1..] = data
    var sheetData = {};
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (!r[0]) continue;
      var clave = r[0].trim();
      sheetData[clave] = {
        name: (r[1]||"").replace(/\n/g," ").trim(),
        role: (r[2]||"").replace(/\n/g," ").trim(),
        dept: (r[3]||"").trim()
      };
    }
    return sheetData;
  } catch(e) {
    console.error("CSV load error", e);
    return {};
  }
}

function buildPeople(sheetData) {
  var people = [];
  Object.keys(META).forEach(function(clave) {
    var meta = META[clave];
    var sheet = sheetData[clave] || {};
    // If meta has hardcoded name/role (vacantes, Tim, special), use those
    var name  = meta.name  || sheet.name  || clave;
    var role  = meta.role  || sheet.role  || "";
    var dept  = meta.dept  || sheet.dept  || "Administración";
    var short = meta.short || (meta.apodo ? meta.apodo + " " + name.split(" ")[1] : null) || firstLastName(name);
    if (meta.apodo) short = meta.apodo + " " + name.split(" ").slice(-1)[0];
    // Overrides for specific roles
    if (clave === "CY001") { role = "Managing Director"; short = "Manuel Otazo"; }
    if (clave === "CY064") { role = "General Manager";   short = "Jorge Guillén"; }
    if (clave === "CY037") short = "Emiliano de la Tejera";
    if (clave === "CY057") short = "Paola Anicacio";
    if (clave === "CY020") short = "Sharon García";
    if (clave === "CY027") short = "Gerardo Tereso";
    people.push({
      id: clave,
      name: name,
      short: short,
      role: role,
      dept: dept,
      jefe: meta.jefe || null,
      nick: meta.apodo || null,
      vac: meta.vac || (name === "VACANTE") || false
    });
  });
  return people;
}

function firstLastName(full) {
  var p = full.trim().split(/\s+/);
  return p[0] + (p[1] ? " " + p[1] : "");
}

// ─── PHOTOS ────────────────────────────────────────────────────────────────
async function loadAllPhotos() {
  // Load each photo directly by numeric ID — no listAll needed
  var numericIds = Object.values(PHOTO_ID);
  var promises = numericIds.map(async function(numId) {
    try {
      var photoRef = ref(storage, "fotos/" + numId + ".jpg");
      var url = await getDownloadURL(photoRef);
      photoCache[numId] = url;
    } catch(e) {
      // Photo doesn't exist yet, skip silently
    }
  });
  await Promise.all(promises);
  refreshAvatars();
}

function refreshAvatars() {
  Object.keys(photoCache).forEach(function(key) {
    var el = document.querySelector('.av[data-id="' + key + '"]');
    if (el) { el.style.background="none"; el.innerHTML='<img src="'+photoCache[key]+'" alt="">'; }
  });
}

function makeAv(p, size) {
  size = size||50;
  var cfg = DEPT_CFG[p.dept]||DEPT_CFG["Administración"];
  var el = document.createElement("div");
  el.className="av"; el.dataset.id=p.id;
  el.style.width=size+"px"; el.style.height=size+"px";
  if (photoCache[PHOTO_ID[p.id]||p.id] && !p.vac) {
    el.style.background="none";
    el.innerHTML='<img src="'+photoCache[PHOTO_ID[p.id]||p.id]+'" alt="'+p.short+'">';
  } else {
    el.style.background=p.vac?"#E8E6E0":cfg.light;
    el.style.color=p.vac?"#999":cfg.text;
    el.textContent=initials(p.name);
  }
  return el;
}

function makeNode(p) {
  var el=document.createElement("div");
  el.className="node"+(p.vac?" vac":"");
  el.dataset.id=p.id; el.dataset.dept=p.dept;
  el.dataset.q=(p.name+" "+p.role+(p.nick?" "+p.nick:"")).toLowerCase();
  if(!p.vac) el.onclick=function(){openModal(p.id);};
  el.appendChild(makeAv(p));
  var nn=document.createElement("div");nn.className="nn";nn.textContent=p.short;el.appendChild(nn);
  var nr=document.createElement("div");nr.className="nr";nr.textContent=p.role;el.appendChild(nr);
  if(p.nick){var nk=document.createElement("div");nk.className="nk";nk.textContent='"'+p.nick+'"';el.appendChild(nk);}
  return el;
}

function buildBranch(person, all) {
  var children=all.filter(function(x){return x.jefe===person.id;});
  var wrap=document.createElement("div");wrap.className="branch";
  wrap.appendChild(makeNode(person));
  if(!children.length) return wrap;
  var stem=document.createElement("div");stem.className="vline";stem.style.height="20px";wrap.appendChild(stem);
  var row=document.createElement("div");row.className="bchildren";
  children.forEach(function(c){row.appendChild(buildBranch(c,all));});
  wrap.appendChild(row);
  return wrap;
}

function drawLines() {
  document.querySelectorAll(".bchildren").forEach(function(row){
    var branches=Array.from(row.children).filter(function(el){return el.classList.contains("branch");});
    if(branches.length<2)return;
    var rr=row.getBoundingClientRect();
    var fn=branches[0].querySelector(".node");
    var ln=branches[branches.length-1].querySelector(".node");
    if(!fn||!ln)return;
    var fr=fn.getBoundingClientRect(),lr=ln.getBoundingClientRect();
    var left=fr.left+fr.width/2-rr.left,right=lr.left+lr.width/2-rr.left;
    var hbar=row.querySelector(":scope>.hline");
    if(!hbar){hbar=document.createElement("div");hbar.className="hline";row.insertBefore(hbar,row.firstChild);}
    hbar.style.left=left+"px";hbar.style.width=(right-left)+"px";
    branches.forEach(function(b){
      var nd=b.querySelector(".node");if(!nd)return;
      var nr=nd.getBoundingClientRect(),cx=nr.left+nr.width/2-rr.left;
      var tick=b.querySelector(":scope>.tick");
      if(!tick){tick=document.createElement("div");tick.className="tick";b.insertBefore(tick,b.firstChild);}
      tick.style.left=cx+"px";tick.style.height="18px";tick.style.transform="translateX(-50%)";
    });
  });
}

function renderDept(dept) {
  var people=P.filter(function(p){return p.dept===dept;});
  var cfg=DEPT_CFG[dept];
  var sec=document.createElement("div");sec.className="dsec";sec.dataset.dept=dept;
  var lbl=document.createElement("div");lbl.className="dlabel";lbl.style.color=cfg.color;
  var dot=document.createElement("span");dot.className="ddot";dot.style.background=cfg.color;
  lbl.appendChild(dot);lbl.appendChild(document.createTextNode(cfg.label));
  sec.appendChild(lbl);
  var roots=people.filter(function(p){return !p.jefe||!people.find(function(x){return x.id===p.jefe;});});
  // Special: Tim and Manuel side by side
  var tim=roots.find(function(r){return r.id==="TIM";});
  var manuel=roots.find(function(r){return r.id==="CY001";});
  if(tim&&manuel){
    var topRow=document.createElement("div");
    topRow.style.cssText="display:flex;gap:12px;justify-content:flex-start;align-items:flex-start;margin-bottom:0";
    topRow.appendChild(makeNode(tim));
    topRow.appendChild(buildBranch(manuel,people));
    sec.appendChild(topRow);
    var others=roots.filter(function(r){return r.id!=="TIM"&&r.id!=="CY001";});
    if(others.length){var rw=document.createElement("div");rw.className="droots";others.forEach(function(r){rw.appendChild(buildBranch(r,people));});sec.appendChild(rw);}
  } else {
    var rw=document.createElement("div");rw.className="droots";
    roots.forEach(function(r){rw.appendChild(buildBranch(r,people));});
    sec.appendChild(rw);
  }
  return sec;
}

function renderAll() {
  var tree=document.getElementById("tree");tree.innerHTML="";
  DEPTS.forEach(function(d){tree.appendChild(renderDept(d));});
  requestAnimationFrame(function(){requestAnimationFrame(drawLines);});
}

function renderStats() {
  var deptLabels={"Administración":"Administración","F&B":"Alimentos & Bebidas","Mantenimiento":"Mantenimiento","Ama de llaves":"Housekeeping","Recepción":"Recepción"};
  var a=P.filter(function(p){return!p.vac;}).length;
  var v=P.filter(function(p){return p.vac;}).length;
  var html='<div class="stat"><div class="stat-n">'+a+'</div><div class="stat-l">Total colaboradores</div></div>'+
           '<div class="stat"><div class="stat-n">'+v+'</div><div class="stat-l">Vacantes abiertas</div></div>';
  DEPTS.forEach(function(d){
    var n=P.filter(function(p){return p.dept===d&&!p.vac;}).length;
    html+='<div class="stat"><div class="stat-n">'+n+'</div><div class="stat-l">'+deptLabels[d]+'</div></div>';
  });
  document.getElementById("stats").innerHTML=html;
}

function renderFilters() {
  var labels={"Administración":"Administración","F&B":"Alimentos & Bebidas","Mantenimiento":"Mantenimiento","Ama de llaves":"Housekeeping","Recepción":"Recepción"};
  var html='<button class="fbtn active" data-dept="all">Todos</button>';
  DEPTS.forEach(function(d){html+='<button class="fbtn" data-dept="'+d+'">'+labels[d]+'</button>';});
  document.getElementById("filters").innerHTML=html;
  document.querySelectorAll(".fbtn").forEach(function(btn){
    btn.onclick=function(){
      document.querySelectorAll(".fbtn").forEach(function(b){b.classList.remove("active");});
      btn.classList.add("active");
      var dept=btn.dataset.dept;
      document.querySelectorAll(".dsec").forEach(function(s){s.classList.toggle("hidden",dept!=="all"&&s.dataset.dept!==dept);});
    };
  });
}

// ─── MODAL ─────────────────────────────────────────────────────────────────
function openModal(id) {
  var p=P.find(function(x){return x.id===id;});if(!p||p.vac)return;
  currentModalId=id;
  var cfg=DEPT_CFG[p.dept]||DEPT_CFG["Administración"];
  var jefe=p.jefe?P.find(function(x){return x.id===p.jefe;}):null;
  var ph=photoCache[PHOTO_ID[id]||id];
  var avHTML=ph
    ?'<div class="mav" onclick="window.triggerUpload()"><img src="'+ph+'" alt=""><div class="mav-ov"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div></div>'
    :'<div class="mav" style="background:'+cfg.light+';color:'+cfg.text+'" onclick="window.triggerUpload()">'+initials(p.name)+'<div class="mav-ov"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div></div>';
  var rows="";
  if(jefe) rows+="<tr><td>Reporta a</td><td>"+jefe.short+"</td></tr>";
  document.getElementById("mbody").innerHTML=
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">'+avHTML+
    '<div><div class="mname">'+p.name+(p.nick?' <span style="font-weight:400;color:#999">"'+p.nick+'"</span>':'')+'</div>'+
    '<div class="mrole">'+p.role+' &middot; '+(DEPT_CFG[p.dept]||{label:p.dept}).label+'</div></div></div>'+
    '<table class="mtable"><tbody>'+rows+'</tbody></table>'+
    '<button class="upload-btn" type="button" onclick="window.triggerUpload()">'+
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Subir mi foto</button>'+
    '<div class="upload-status" id="upload-status"></div>';
  document.getElementById("overlay").classList.add("open");
}

window.triggerUpload=function(){document.getElementById("file-input").click();};

async function compressImage(file,maxSize){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement("canvas");
        var ratio=Math.min(maxSize/img.width,maxSize/img.height,1);
        canvas.width=img.width*ratio;canvas.height=img.height*ratio;
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(function(blob){resolve(blob);},"image/jpeg",0.85);
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

document.getElementById("file-input").addEventListener("change",async function(e){
  var file=e.target.files[0];if(!file||!currentModalId)return;
  var btn=document.querySelector(".upload-btn"),status=document.getElementById("upload-status");
  if(!btn||!status)return;
  btn.textContent="Subiendo…";btn.disabled=true;
  try{
    var compressed=await compressImage(file,400);
    var numId=PHOTO_ID[currentModalId]||currentModalId;
var storageRef=ref(storage,"fotos/"+numId+".jpg");
    await uploadBytes(storageRef,compressed);
    var url=await getDownloadURL(storageRef);
    photoCache[PHOTO_ID[currentModalId]||currentModalId]=url;
    var mavEl=document.querySelector(".mav");
    if(mavEl){mavEl.style.background="none";mavEl.innerHTML='<img src="'+url+'" alt=""><div class="mav-ov"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div>';}
    var nodeAv=document.querySelector('.av[data-id="'+currentModalId+'"]');
var numId2=PHOTO_ID[currentModalId]||currentModalId;
    if(nodeAv){nodeAv.style.background="none";nodeAv.innerHTML='<img src="'+url+'" alt="">';}
    btn.textContent="✓ Foto actualizada";status.textContent="Visible para todo el equipo";
  }catch(err){btn.textContent="Subir mi foto";status.textContent="Error al subir. Intenta de nuevo.";console.error(err);}
  btn.disabled=false;e.target.value="";
});

document.getElementById("search").addEventListener("input",function(){
  var q=this.value.toLowerCase().trim();
  document.querySelectorAll(".node").forEach(function(n){
    var m=!q||n.dataset.q.includes(q);
    n.classList.toggle("dim",!m&&!!q);n.classList.toggle("hl",m&&!!q);
  });
});

document.getElementById("overlay").onclick=function(e){if(e.target===this){this.classList.remove("open");currentModalId=null;}};
document.getElementById("mclose").onclick=function(){document.getElementById("overlay").classList.remove("open");currentModalId=null;};
window.addEventListener("resize",function(){requestAnimationFrame(drawLines);});

// ─── INIT ──────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded",function(){
  if(sessionStorage.getItem("cy_auth")==="1"){
    document.getElementById("lock-screen").style.display="none";
  }
  var input=document.getElementById("pin-input");
  if(input){
    input.addEventListener("keydown",function(e){if(e.key==="Enter")window.checkPin();});
    input.addEventListener("keyup",function(e){if(e.key==="Enter"||e.keyCode===13)window.checkPin();});
    input.focus();
  }
});

(async function(){
  var sheetData = await loadCSV();
  P = buildPeople(sheetData);
  renderStats();
  renderFilters();
  renderAll();
  loadAllPhotos();
})();
